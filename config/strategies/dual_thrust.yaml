# 双推策略配置
# Dual Thrust 突破策略

name: "DualThrust"
module_path: "strategy.dual_thrust"
config_class: "DualThrustConfig"

# 策略参数
parameters:
  # 核心参数
  lookback_period: 4             # 回溯期
  k1: 0.7                        # 上轨系数
  k2: 0.7                        # 下轨系数
  
  # 仓位管理
  qty_percent: 0.1               # 仓位比例10%
  leverage: 1                    # 杠杆倍数
  max_positions: 1               # 最大持仓数
  
  # 风险管理
  stop_loss_pct: 0.02            # 止损2%
  use_trailing_stop: false       # 不使用追踪止损
  
  # 时间管理
  max_hold_bars: 24              # 最大持仓时间24小时
  close_at_session_end: true     # 会话结束时平仓
  
  # 过滤条件
  min_range_pct: 0.005           # 最小波动范围0.5%
  use_volume_filter: true        # 启用成交量过滤
  min_volume_ratio: 1.2          # 最小成交量比率
  
  # 日志控制
  enable_signal_logging: true    # 启用信号日志
  enable_range_logging: true     # 启用区间日志