config_class: KeltnerRSBreakoutConfig
module_path: strategy.keltner_rs_breakout
name: KeltnerRSBreakoutStrategy
parameters:
  # 基础参数
  timeframe: 1d
  timeframes:
  - main
  origination: EXTERNAL
  price_type: LAST

  # 技术指标参数
  atr_period: 20
  ema_period: 20
  sma_period: 200
  bb_period: 20
  bb_std: 1.5
  volume_period: 20

  # Keltner 通道参数
  keltner_base_multiplier: 1.5
  keltner_trigger_multiplier: 2.2

  # 相对强度参数
  btc_symbol: BTCUSDT
  rs_short_lookback_days: 5
  rs_long_lookback_days: 20
  rs_short_weight: 0.7
  rs_long_weight: 0.3

  # Squeeze 参数
  squeeze_memory_days: 1

  # 入场过滤器参数
  volume_multiplier: 1.2  # 温和量能确认
  max_upper_wick_ratio: 0.4
  min_body_ratio: 0.5  # K线实体质量检测

  # 风险管理参数
  base_risk_pct: 0.05
  high_conviction_risk_pct: 0.075
  leverage: 2
  max_positions: 5
  max_position_risk_pct: 0.2  # 单个资产最大仓位占比

  # 出场参数
  stop_loss_atr_multiplier: 2.8  # Chandelier Exit
  enable_time_stop: false
  time_stop_bars: 3
  time_stop_momentum_threshold: 0.01

  # Universe 参数
  universe_top_n: 15
  universe_freq: W-MON

  # 市场狂热度过滤器参数
  enable_euphoria_filter: false
  funding_rate_warning_annual: 100.0
  funding_rate_danger_annual: 200.0
  euphoria_reduce_position_pct: 0.5
  data_types:
  - funding
