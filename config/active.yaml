# 当前活跃配置选择
# 这个文件控制当前使用的环境和策略

# 当前环境 (可选: dev, prod)
environment: "prod"

# 当前策略 (可选: oi_divergence, rs_squeeze, dual_thrust, kalman_pairs, dk_alpha_trend)
strategy: "dk_alpha_trend"

# 主要交易对 (单标的模式时使用)
primary_symbol: "ETHUSDT"

# 数据加载参数 (可选，用于覆盖策略配置)
# timeframe: "1d"        # 时间框架: 1m, 5m, 15m, 1h, 4h, 1d 等
# price_type: "LAST"     # 价格类型: LAST, MID, BID, ASK
# origination: "EXTERNAL" # 数据来源: EXTERNAL, INTERNAL

# 运行时覆盖配置 (可选)
# 这里的设置会覆盖环境和策略配置中的对应项
overrides:
  # 可以覆盖回测时间范围
  backtest:
    start_date: "2022-01-01"
    end_date: "2026-01-01"

  # 可以覆盖交易设置
  trading:
    initial_balance: 100

  # 可以覆盖策略参数
  # strategy:
  #   max_positions: 3
  #   qty_percent: 0.05
