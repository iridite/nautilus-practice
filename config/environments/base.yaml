# 基础环境配置 - 所有环境的共同配置

# 回测时间范围（供继承环境作为默认值）
# 注意：live 环境虽然不执行回测，但 EnvironmentConfig 当前要求存在 backtest 字段。
backtest:
  start_date: "2024-01-01"
  end_date: "2024-12-31"

trading:
  venue: "BINANCE"
  instrument_type: "SWAP"
  currency: "USDT"

logging:
  level: "INFO"
  file_level: "DEBUG"
  components:
    BacktestEngine: "INFO"
    DataFeed: "INFO"
    Strategy: "INFO"
  components_only: true

file_cleanup:
  enabled: true
  use_time_rotation: true
  keep_days: 7
  delete_days: 30
  max_files_per_dir: 50
  target_dirs:
    - "log"
    - "output"
