# 基础环境配置 - 所有环境的共同配置

trading:
  venue: "BINANCE"
  instrument_type: "SWAP"
  currency: "USDT"

logging:
  level: "INFO"
  file_level: "DEBUG"
  components:
    BacktestEngine: "INFO"
    DataFeed: "INFO"
    Strategy: "INFO"
  components_only: true

file_cleanup:
  enabled: true
  use_time_rotation: true
  keep_days: 7
  delete_days: 30
  max_files_per_dir: 50
  target_dirs:
    - "log"
    - "output"
