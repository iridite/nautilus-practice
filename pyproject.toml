[project]
name = "nautilus-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.15"

dependencies = [
    "ccxt>=4.5.28",
    "joblib>=1.5.3",
    "jupyterlab>=4.5.1",
    "langchain-anthropic>=1.3.1",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.6",
    "langgraph-api>=0.7.0",
    "langgraph-cli>=0.4.11",
    "lightgbm>=4.6.0",
    "nautilus-trader",
    "pandas-stubs~=2.3.3",
    "plotly>=6.5.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "ta>=0.11.0",
    "tqdm>=4.66.0",
]

[tool.uv]
# 必须保留，允许安装 alpha/dev 版本
prerelease = "allow"

[[tool.uv.index]]
name = "nautilus"
url = "https://packages.nautechsystems.io/simple"

[tool.uv.sources]
nautilus-trader = { index = "nautilus" }
